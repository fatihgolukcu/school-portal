services:
  portal:
    build: .
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-http://127.0.0.1:54321}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    restart: unless-stopped
