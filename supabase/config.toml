project_id = "school-portal"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:5173/**", "http://127.0.0.1:5173", "http://127.0.0.1:5173/**", "http://localhost:8888", "http://localhost:8888/**", "http://127.0.0.1:8888", "http://127.0.0.1:8888/**"]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 10

[auth.email]
# This switch enables the email provider, including login and invitations.
# Public account creation remains disabled by auth.enable_signup above.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[analytics]
enabled = false
